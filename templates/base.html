{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}VIDeR Interiors — Bangalore{% endblock %}</title>
  <meta name="description" content="{% block description %}Structured interior design and execution for Bangalore homeowners. No delays, no hidden costs.{% endblock %}" />

  <!-- Canonical URL -->
  <link rel="canonical" href="{% block canonical %}https://www.viderinteriors.com/{% endblock %}" />

  <!-- Open Graph (Meta Ads / Facebook / Instagram) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="VIDeR Interiors" />
  <meta property="og:title" content="{% block og_title %}VIDeR Interiors — Structured Interiors for Bangalore Homeowners{% endblock %}" />
  <meta property="og:description" content="{% block og_description %}Got flat possession in Bangalore? Plan your interiors before you move in. No delays, no hidden costs.{% endblock %}" />
  <meta property="og:url" content="{% block og_url %}https://www.viderinteriors.com/{% endblock %}" />
  {% comment %} <meta property="og:image" content="{% block og_image %}{% static 'images/assets/og-cover.jpg' %}{% endblock %}" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" /> {% endcomment %}
  <meta property="og:locale" content="en_IN" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{% block twitter_title %}VIDeR Interiors — Structured Interiors for Bangalore Homeowners{% endblock %}" />
  <meta name="twitter:description" content="{% block twitter_description %}Got flat possession in Bangalore? Plan your interiors before you move in.{% endblock %}" />
  <meta name="twitter:image" content="{% block twitter_image %}{% static 'images/assets/og-cover.jpg' %}{% endblock %}" />

  <!-- Google Ads conversion tracking placeholder -->
  {% block head_scripts %}{% endblock %}

  <link rel="preload" href="{% static 'fonts/space-grotesk-v22-latin-700.woff2' %}" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="{% static 'css/output.css' %}" />
  <style>html { scroll-behavior: smooth; }</style>
</head>


<!-- Google tag (gtag.js) — replace AW-XXXXXXXXX with your ID -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-XXXXXXXXX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'AW-XXXXXXXXX');
</script>

<!-- Meta Pixel — replace XXXXXXXXXXXXXXXXXX with your Pixel ID -->
<script>
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
  n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
  document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', 'XXXXXXXXXXXXXXXXXX');
  fbq('track', 'PageView');
</script>
<noscript>
  <img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=XXXXXXXXXXXXXXXXXX&ev=PageView&noscript=1"/>
</noscript>


<body class="bg-background text-foreground">

  <!-- NAVBAR — desktop only -->
  <header class="hidden md:flex fixed top-0 left-0 right-0 z-50 bg-white/20 backdrop-blur-md border-b border-white/20">
    <div class="w-full px-8 h-16 flex items-center justify-between">

      <!-- Logo + Name -->
      <a href="/" class="flex items-center gap-1 rounded-lg">
        <img src="{% static 'images/assets/logo.png' %}"
             alt="VIDeR Interiors"
             class="h-12 w-auto" />
        {% comment %} <span class="font-display font-bold text-lg px-1 py-2.5 text-foreground tracking-wide">VIDeR</span> {% endcomment %}
      </a>

      <!-- CTA -->
      <a href="#consultation-form"
         class="bg-primary text-primary-foreground px-5 py-2.5 rounded-lg text-sm font-display font-semibold hover:opacity-90 transition-opacity">
        Book Free Call
      </a>

    </div>
  </header>

  <!-- MAIN CONTENT — no top padding, hero extends under navbar -->
  <main>
    {% block content %}{% endblock %}
  </main>

     <!-- MOBILE STICKY CTA BAR - mobile only -->
<div class="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-card border-t border-border p-3">
    <div class="flex gap-3 px-1">
        <a href="#consultation-form"
           class="flex-1 bg-primary text-primary-foreground rounded-lg py-3 text-base font-semibold text-center transition-opacity hover:opacity-90">
            Book Free Call
        </a>
        <a href="https://wa.me/918951482555" target="_blank" rel="noopener noreferrer"
   class="flex-1 rounded-lg py-3 text-base font-semibold text-center transition-opacity hover:opacity-90"
   style="background-color: #128C7E; color: white; display: block;">
    WhatsApp
</a>
    </div>

  {% block scripts %}{% endblock %}
</body>
</html>
